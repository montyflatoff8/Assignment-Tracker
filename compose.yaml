# Local two-service topology: the Assignment Tracker API + PostgreSQL 17.
#   docker compose up -d --build     start (rebuilds the API image)
#   docker compose down              stop and remove containers (data stays in the pgdata volume)
#   docker compose down -v           ALSO deletes the volume (all data) - don't use for the persistence test
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Database__Host=db
      - Database__Port=5432
      - Database__Name=student_db
      - Database__Username=postgres
      - Database__Password=localdevpassword123
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=student_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=localdevpassword123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only the first time, when the pgdata volume is empty.
      - ./init-schema.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d student_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge
