# Builds the API image, pushes it to the class container registry, and deploys it to
# Azure Container Apps.
#
# Sign-in uses GitHub OIDC (no passwords or secrets): Azure trusts the identity
# id-wp1-f26-s04 only for workflows running from montyflatoff8/wp1-fall26-azure on main,
# so this job is skipped in any other repo (such as Assignment-Tracker).
#
# The running app uses a different identity, id-wp1-f26-s04-runtime, to pull its image
# and to get Microsoft Entra tokens for PostgreSQL (Database__UseManagedIdentity=true).
#
# Database connection: set these repository variables on GitHub
# (Settings > Secrets and variables > Actions > Variables), then re-run this workflow:
#   DB_HOST   e.g. <server>.postgres.database.azure.com
#   DB_NAME   your database name
#   DB_USER   the PostgreSQL role mapped to id-wp1-f26-s04-runtime
# Until they are set, the app deploys and runs but database calls return 503.

name: Deploy API to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write    # lets the job request an OIDC token for azure/login
  contents: read

env:
  AZURE_TENANT_ID: 2db2e86b-779f-46ba-919a-e062bddec8f6
  AZURE_SUBSCRIPTION_ID: 53e48d05-17eb-429a-8c7e-62fc0bff29f2
  DEPLOY_CLIENT_ID: 8a75be5f-38c2-4899-b528-0c57480f1261     # id-wp1-f26-s04
  RESOURCE_GROUP: rg-wp1-f26-s04
  ACR_NAME: acrwp1f26c6f36039
  ACR_LOGIN_SERVER: acrwp1f26c6f36039.azurecr.io
  IMAGE_REPOSITORY: wp1/s04/assignment-tracker-api
  CONTAINERAPP_ENV: cae-wp1-f26-s04-eus2
  CONTAINERAPP_NAME: wp1-s04-api              # the class policy only allows wp1-s04-api / wp1-s04-frontend
  RUNTIME_IDENTITY: id-wp1-f26-s04-runtime

jobs:
  deploy:
    if: github.repository == 'montyflatoff8/wp1-fall26-azure'
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Sign in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.DEPLOY_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image
        run: |
          IMAGE="$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY:${GITHUB_SHA::7}"
          az acr login --name "$ACR_NAME"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Create or update the Container App
        env:
          DB_HOST: ${{ vars.DB_HOST || 'db-not-configured.invalid' }}
          DB_NAME: ${{ vars.DB_NAME || 'not_configured' }}
          DB_USER: ${{ vars.DB_USER || 'not_configured' }}
        run: |
          RG_ID="/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP"
          APP_ID="$RG_ID/providers/Microsoft.App/containerApps/$CONTAINERAPP_NAME"
          ENV_ID="$RG_ID/providers/Microsoft.App/managedEnvironments/$CONTAINERAPP_ENV"
          RUNTIME_ID="$RG_ID/providers/Microsoft.ManagedIdentity/userAssignedIdentities/$RUNTIME_IDENTITY"
          RUNTIME_CLIENT_ID=$(az identity show --ids "$RUNTIME_ID" --query clientId -o tsv)
          API="https://management.azure.com$APP_ID?api-version=2024-03-01"

          # The full Container App definition, sent straight to the Azure Resource Manager API
          # (a PUT creates the app or updates it). Every setting the class policy
          # (wp1-f26-s04-apps) checks is explicit: name, eastus2, Single revision mode,
          # one container, 0.5 CPU / 1Gi memory, min 0 / max 1 replicas.
          # The image is pulled with the runtime identity, which already has
          # Repository Reader on the registry.
          jq -n \
            --arg env "$ENV_ID" --arg rid "$RUNTIME_ID" --arg acr "$ACR_LOGIN_SERVER" --arg image "$IMAGE" \
            --arg dbHost "$DB_HOST" --arg dbName "$DB_NAME" --arg dbUser "$DB_USER" --arg miClient "$RUNTIME_CLIENT_ID" \
            '{
              location: "eastus2",
              identity: { type: "UserAssigned", userAssignedIdentities: { ($rid): {} } },
              properties: {
                environmentId: $env,
                configuration: {
                  activeRevisionsMode: "Single",
                  ingress: { external: true, targetPort: 8080, transport: "auto" },
                  registries: [ { server: $acr, identity: $rid } ]
                },
                template: {
                  containers: [ {
                    name: "api",
                    image: $image,
                    resources: { cpu: 0.5, memory: "1Gi" },
                    env: [
                      { name: "ASPNETCORE_ENVIRONMENT",            value: "Production" },
                      { name: "Database__Host",                    value: $dbHost },
                      { name: "Database__Port",                    value: "5432" },
                      { name: "Database__Name",                    value: $dbName },
                      { name: "Database__Username",                value: $dbUser },
                      { name: "Database__UseManagedIdentity",      value: "true" },
                      { name: "Database__ManagedIdentityClientId", value: $miClient }
                    ]
                  } ],
                  scale: { minReplicas: 0, maxReplicas: 1 }
                }
              }
            }' > containerapp.json

          # Up to 3 attempts: Azure API calls occasionally drop with "connection reset".
          for attempt in 1 2 3; do
            echo "Deploying $CONTAINERAPP_NAME (attempt $attempt)"
            az rest --method put --url "$API" --body @containerapp.json -o none && break
            if [ "$attempt" = 3 ]; then echo "Deployment failed after 3 attempts"; exit 1; fi
            echo "Retrying in 20 seconds..."; sleep 20
          done

          # Wait for Azure to finish provisioning (up to ~5 minutes)
          for i in $(seq 1 30); do
            STATE=$(az rest --method get --url "$API" --query properties.provisioningState -o tsv 2>/dev/null || echo "Unknown")
            echo "Provisioning state: $STATE"
            [ "$STATE" = "Succeeded" ] && break
            if [ "$STATE" = "Failed" ]; then
              az rest --method get --url "$API" --query properties -o json
              exit 1
            fi
            sleep 10
          done

          FQDN=$(az rest --method get --url "$API" --query properties.configuration.ingress.fqdn -o tsv)
          echo "Deployed: https://$FQDN/api/assignments" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed: https://$FQDN/api/assignments"
